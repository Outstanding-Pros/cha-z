<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0B0C0E">
  <title>차~즈</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>차~즈</h1>
    <span id="status" class="pill">연결 확인 중…</span>
  </header>

  <!-- P1 페어링 -->
  <section id="p1" hidden>
    <div class="card center">
      <div class="big">🚗📱</div>
      <h2 id="p1-title">차량과 연결 중…</h2>
      <p id="p1-text" class="sub"></p>
      <button id="p1-go" class="primary" hidden>받은 사진 보기</button>
    </div>
  </section>

  <!-- 연결 안 됨 -->
  <section id="unpaired" hidden>
    <div class="card center">
      <div class="big">📷</div>
      <h2>차량 화면의 QR을 찍어 연결하세요</h2>
      <p class="sub">정차 중에 차~즈 → 결과 화면의 ‘폰으로 보내기’ 또는 설정 → ‘폰 연결’에서 QR이 나와요.</p>
    </div>
  </section>

  <!-- P2 받은 세션·완성본 -->
  <section id="p2" hidden>
    <h2 class="section">받은 사진</h2>
    <p id="empty" class="sub">아직 받은 사진이 없어요. 차에서 “차즈 폰으로 보내줘”라고 말해 보세요.</p>
    <div id="grid" class="grid"></div>
  </section>

  <!-- P4 저장·공유 -->
  <dialog id="viewer">
    <img id="viewer-img" alt="차~즈 사진">
    <p id="viewer-meta" class="sub"></p>
    <div class="row">
      <a id="save" class="button primary" download>기기에 저장</a>
      <button id="share">공유</button>
      <button id="link">공유 링크</button>
    </div>
    <p id="link-out" class="sub"></p>
    <button id="close" class="ghost">닫기</button>
  </dialog>

  <div id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
